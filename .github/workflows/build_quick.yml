name: Quick Test Build

# Manual only. Adapted for this fork: runs on a standard GitHub-hosted runner
# and builds an installable FOSS debug APK, because the fork has no release
# signing secrets and no access to the upstream Blacksmith runners.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Quick FOSS Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The debug keystore lives only on the runner and in the Actions cache,
      # never in git. Reusing it keeps the signature stable so that updates
      # install over the previous build.
      - name: Restore CI debug keystore
        id: ci_keystore
        uses: actions/cache/restore@v6
        with:
          path: app/ci-debug.keystore
          key: ci-debug-keystore-v1

      - name: Generate CI debug keystore if not cached
        if: steps.ci_keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore app/ci-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Master Music CI Debug,O=Master Music,C=US"

      - name: Save CI debug keystore
        if: steps.ci_keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: app/ci-debug.keystore
          key: ${{ steps.ci_keystore.outputs.cache-primary-key }}

      - name: Build Debug APK
        run: ./gradlew --console=plain assembleFossDebug --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.test
          METROLIST_APP_NAME: Master Code Music
          METROLIST_DEBUG_KEYSTORE_PATH: ci-debug.keystore
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
